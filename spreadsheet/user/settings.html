  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="page-hero-title">Settings</h1>
        <p class="page-hero-subtitle">Customize your experience</p>
      </div>
    </section>

    <section class="section settings-section">
      <div class="container">
        <div class="settings-group">
          <h3>Theme</h3>
          <div class="theme-options" id="themeOptions">
            <div class="theme-option" data-theme="light" onclick="setThemeMode('light')">Light</div>
            <div class="theme-option" data-theme="dark" onclick="setThemeMode('dark')">Dark</div>
            <div class="theme-option" data-theme="auto" onclick="setThemeMode('auto')">Auto</div>
          </div>
        </div>
        <div class="settings-group">
          <h3>Accent Color</h3>
          <div class="accent-options" id="accentOptions">
            <button class="accent-option" data-color="#ff8c00" style="background:#ff8c00" onclick="setAccentColor('#ff8c00')" aria-label="Orange"></button>
            <button class="accent-option" data-color="#e74c3c" style="background:#e74c3c" onclick="setAccentColor('#e74c3c')" aria-label="Red"></button>
            <button class="accent-option" data-color="#3498db" style="background:#3498db" onclick="setAccentColor('#3498db')" aria-label="Blue"></button>
            <button class="accent-option" data-color="#2ecc71" style="background:#2ecc71" onclick="setAccentColor('#2ecc71')" aria-label="Green"></button>
            <button class="accent-option" data-color="#9b59b6" style="background:#9b59b6" onclick="setAccentColor('#9b59b6')" aria-label="Purple"></button>
            <button class="accent-option" data-color="#1abc9c" style="background:#1abc9c" onclick="setAccentColor('#1abc9c')" aria-label="Teal"></button>
          </div>
        </div>
        <div class="settings-group">
          <h3>Notifications</h3>
          <button class="btn btn-primary" onclick="requestNotificationPermission()">Enable Notifications</button>
        </div>
      </div>
    </section>
  </main>

  

  <div class="toast-container" id="toastContainer"></div>
