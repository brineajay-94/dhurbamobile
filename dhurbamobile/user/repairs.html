<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repair Status - Dhurba Mobile</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b00'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='18' font-weight='bold' font-family='sans-serif'%3ED%3C/text%3E%3C/svg%3E">
  <script src="../sheets-api.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="../firebase-data.js"></script>
  <script src="js/user-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
</head>
<body>
  <div class="sub-banner-strip" id="subBannerStrip"></div>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">D</div>
        <span>Dhurba Mobile</span>
      </a>
      <nav class="header-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="repairs.html" class="active">Repairs</a>
        <a href="notifications.html">Updates</a>
        <a href="about.html">About</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" onclick="window.location.href='notifications.html'" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge" id="notifBadge"></span>
        </button>
        <button class="icon-btn theme-btn" onclick="toggleTheme()" title="Toggle theme">
          <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page-transition">
    <section class="repairs-hero">
      <div class="container">
        <h1>Track Your Repair</h1>
        <p>Enter your phone number to check the status of your repair</p>
        <div class="repair-search-box">
          <input type="tel" id="repairSearchInput" placeholder="Enter phone number..." maxlength="10">
          <button onclick="searchRepair()">Search</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-header">
          <div>
            <h2 class="section-title">Repair Status</h2>
            <p class="section-subtitle" id="resultCount">Real-time updates on your repairs</p>
          </div>
        </div>
        <div class="repairs-list" id="repairsList">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <h3>Search for a Repair</h3>
            <p>Enter your phone number above to check your repair status</p>
          </div>
        </div>
      </div>
    </section>
  </main>


  <div class="toast-container" id="toastContainer"></div>

</body>
</html>
